services:
  keycloak:
    build: ./keycloak
    image: fourprep-keycloak:dev
    container_name: fourprep-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/fourprep_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
    ports:
      - '8080:8080'
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - mailpit

  # Local SMTP server: Keycloak sends verification and password reset emails here.
  # Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: fourprep-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
