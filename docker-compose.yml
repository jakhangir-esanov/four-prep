services:
  keycloak:
    build: ./keycloak
    image: fourprep-keycloak:dev
    container_name: fourprep-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/fourprep_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
    ports:
      - '8080:8080'
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - mailpit

  # Local SMTP server: Keycloak sends verification and password reset emails here.
  # Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: fourprep-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  # Local S3-compatible object storage for uploaded files (Hetzner Object Storage in production).
  # MinIO no longer publishes community images, so SeaweedFS's S3 gateway stands in locally.
  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    container_name: fourprep-storage
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=http://localhost:4200
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  # Creates the private documents bucket once SeaweedFS is up; harmless if it already exists.
  seaweedfs-buckets:
    image: chrislusf/seaweedfs:3.85
    container_name: fourprep-storage-buckets
    entrypoint: /bin/sh
    command: -c "until echo 's3.bucket.create -name fourprep-documents' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1 | grep -q 'created bucket'; do sleep 3; done"
    depends_on:
      - seaweedfs
    restart: 'no'

  # Scans every confirmed upload (clamd on port 3310). The first start downloads the virus
  # signatures and takes a few minutes before scans are answered. clamd.conf reports files
  # that exceed the scan limits as infected (AlertExceedsMax) instead of passing them.
  clamav:
    image: clamav/clamav:1.4.3
    container_name: fourprep-clamav
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-data:/var/lib/clamav

volumes:
  seaweedfs-data:
  clamav-data:
